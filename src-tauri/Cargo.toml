[package]
name = "agenda"
version = "0.1.0"
description = "Agenda — calendario de escritorio con widget"
authors = ["Nacho Garrido"]
edition = "2021"

[lib]
name = "agenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
