name: Tests y build de Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias de sistema (Tauri en Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Tests de lógica (fechas, zona horaria, repeticiones, parser)
        run: npm test
      - name: Tests del backend (SQLite)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tests de interfaz
        run: npx playwright install --with-deps chromium && npm run test:e2e

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Compilar instalador
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
