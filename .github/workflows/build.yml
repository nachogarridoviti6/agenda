name: Tests y build de Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias de sistema (Tauri en Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Tests de lógica (fechas, zona horaria, repeticiones, parser)
        run: npm test
      - name: Tests del backend (SQLite)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Tests de interfaz
        run: npx playwright install --with-deps chromium && npm run test:e2e

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Compilar instalador
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Agenda-instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: ¿Versión nueva?
        id: version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar Release con el instalador
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Agenda ${{ steps.version.outputs.tag }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Descarga **Agenda_*_x64-setup.exe** (abajo, en *Assets*) y ábrelo.
            Si Windows muestra un aviso azul, pulsa **Más información → Ejecutar de todas formas** (el instalador no está firmado).
